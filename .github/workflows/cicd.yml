name: My first pipeline

on:
    push:
        branches: [ "main" ]

jobs:
    build: 
        runs-on: ubuntu-latest
        steps:
           - name: Clone the code 
             uses: actions/checkout@v4
           - name: Build image
             run:
                docker build -t handes007/cicd-portfolio .  
           - name: Docker login
             uses: docker/login-action@v3
             with:
                username: handes007
                password: ${{ secrets.DOCKER_PASSWORD }}
           - name: push image
             run:
                docker push handes007/cicd-portfolio
                



